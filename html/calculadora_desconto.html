<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <link rel="stylesheet" href="../css/Calculadora_desconto.css">
    <script src="../js/Calculadora_desconto.js" defer></script>
</head>
<body>

<div class="container">
    <h2>Calculadora de Desconto</h2>
    
    <form id="discountForm">
        <div class="form-group">
            <label for="productName">Nome do Produto</label>
            <input type="text" id="productName" placeholder="Ex: Camiseta Nike" required>
        </div>

        <div class="form-group">
            <label for="productValue">Valor Original (R$)</label>
            <input type="number" id="productValue" step="0.01" min="0" placeholder="0,00" required>
        </div>

        <div class="form-group">
            <label for="discountPercentage">Desconto (a cada 5%)</label>
            <select id="discountPercentage" required>
                <option value="0">0% (Sem desconto)</option>
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
                <option value="25">25%</option>
                <option value="30">30%</option>
                <option value="35">35%</option>
                <option value="40">40%</option>
                <option value="45">45%</option>
                <option value="50">50%</option>
                <option value="55">55%</option>
                <option value="60">60%</option>
                <option value="65">65%</option>
                <option value="70">70%</option>
                <option value="75">75%</option>
                <option value="80">80%</option>
                <option value="85">85%</option>
                <option value="90">90%</option>
                <option value="95">95%</option>
                <option value="100">100% (Grátis)</option>
            </select>
        </div>

        <button type="submit">Calcular Desconto</button>
    </form>

    <div class="result-box" id="resultBox">
        <h3>Resumo do Cálculo</h3>
        <div class="result-item">
            <span>Produto:</span>
            <span id="resProduct" class="highlight">-</span>
        </div>
        <div class="result-item">
            <span>Valor do Produto:</span>
            <span id="resOriginalValue">-</span>
        </div>
        <div class="result-item">
            <span>Desconto Aplicado:</span>
            <span id="resDiscountApplied" style="color: #dc3545;">-</span>
        </div>
        <div class="result-item">
            <span>Total com Desconto:</span>
            <span id="resTotalValue" style="color: #28a745;">-</span>
        </div>
    </div>
</div>

</body>
</html>
